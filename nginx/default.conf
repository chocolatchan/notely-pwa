server {
    listen 80;

    # ── Gzip Compression ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Proxy to Frontend (Vite preview or dev server)
    location / {
        proxy_pass http://notely-app:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Vite HMR (dev mode)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Cache static assets aggressively (JS/CSS have content hashes from Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|webp|avif)$ {
        proxy_pass http://notely-app:5173;
        proxy_set_header Host $host;

        # 1 year cache — safe because Vite uses content hashes in filenames
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy to Backend API (no caching)
    location /api/ {
        proxy_pass http://notely-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }

    # Proxy to User Uploads (moderate caching)
    location /uploads/ {
        proxy_pass http://notely-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        expires 7d;
        add_header Cache-Control "public";
    }
}
