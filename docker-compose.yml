services:
  notely-app:
    build: ./client
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    working_dir: /app
    environment:
      - NODE_ENV=development
    command: npm run dev

  notely-api:
    build: ./server
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    working_dir: /app
    environment:
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongodb:27017/notely
      - PORT=3000
    command: npm start
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    volumes:
      - mongodb_data:/data/db

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - notely-app
      - notely-api

  ngrok:
    image: ngrok/ngrok:latest
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "nginx:80"
    ports:
      - "4040:4040"
    depends_on:
      - nginx

volumes:
  mongodb_data:
  client_node_modules:
  server_node_modules:


